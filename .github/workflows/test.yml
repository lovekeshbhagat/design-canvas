name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # ubuntu-latest no longer ships Python 3.9
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (engine, reviews, MCP server)
        run: python -m unittest discover tests -v
      - name: Build the sample
        run: python engine/build.py examples/acme-habits --json
      - name: Drift check the sample
        run: python engine/build.py examples/acme-habits --check
